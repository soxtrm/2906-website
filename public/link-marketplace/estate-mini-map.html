<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Property street mini map</title><style>
html,body{margin:0;height:100%;overflow:hidden;background:#092525}#stage{position:absolute;inset:-30%;transform-origin:50% 50%;animation:compass 64s linear infinite;will-change:transform}#map{position:absolute;inset:0;background:#092525}.leaflet-tile-pane{filter:invert(1) hue-rotate(166deg) saturate(.42) brightness(.88) contrast(1.22);opacity:.86}.leaflet-control-attribution{display:none}.leaflet-overlay-pane,.leaflet-marker-pane,.leaflet-tooltip-pane{filter:none}.leaflet-tooltip{border:1px solid #d9c274!important;border-radius:999px!important;background:#0b2929e8!important;box-shadow:0 3px 10px #00181899!important;color:#fff!important;font:700 9px/1.1 system-ui,sans-serif!important;padding:5px 8px!important}.leaflet-tooltip:before{display:none}.poi{filter:drop-shadow(0 2px 3px #001817)}
#shade{position:absolute;z-index:500;inset:0;pointer-events:none;background:radial-gradient(circle at center,transparent 0 38%,rgb(4 25 25/.08) 58%,rgb(4 22 22/.78) 88%,#041616 100%)}#rings{position:absolute;z-index:520;inset:0;pointer-events:none;background:repeating-radial-gradient(circle at center,transparent 0 14.7%,rgb(205 229 216/.38) 15%,transparent 15.35%,transparent 29.7%)}#focus{position:absolute;z-index:560;left:50%;top:50%;width:20px;height:20px;transform:translate(-50%,-50%);border:1px solid #f4dda0aa;border-radius:50%;box-shadow:0 0 0 7px #efd7860d}#focus:before,#focus:after{content:"";position:absolute;background:#f4dda0}#focus:before{left:50%;top:-5px;width:1px;height:30px}#focus:after{left:-5px;top:50%;width:30px;height:1px}.home-pin{filter:drop-shadow(0 2px 4px #001818)}
@keyframes compass{0%{transform:rotate(0deg) scale(1.02)}25%{transform:rotate(90deg) scale(1.09)}50%{transform:rotate(180deg) scale(1.035)}75%{transform:rotate(270deg) scale(1.12)}100%{transform:rotate(360deg) scale(1.02)}}@media(prefers-reduced-motion:reduce){#stage{animation:none;transform:scale(1.03)}}
</style><div id="stage"><div id="map"></div></div><div id="shade"></div><div id="rings"></div><div id="focus" aria-hidden="true"></div><script type="module">
let leafletLoading;const colours={restaurant:'#e3b866',cafe:'#e18d72',groceries:'#7fd5ae',coast:'#6bd5ea',movement:'#b1a4ff',health:'#ef8996',school:'#ecd47e',commute:'#91b2d4'};const ll=c=>[c[1],c[0]];let map,markers=[],latest,key='';
async function leaflet(){if(window.L)return window.L;if(!leafletLoading)leafletLoading=Promise.all([new Promise((ok,no)=>{const e=document.createElement('link');e.rel='stylesheet';e.href='/link-marketplace/vendor/leaflet.css';e.onload=ok;e.onerror=no;document.head.append(e)}),new Promise((ok,no)=>{const e=document.createElement('script');e.src='/link-marketplace/vendor/leaflet.js';e.onload=ok;e.onerror=no;document.head.append(e)})]).then(()=>window.L);return leafletLoading}
function clear(){if(!map)return;markers.forEach(marker=>map.removeLayer(marker));markers=[]}
async function render(){if(!latest?.origin)return;const L=await leaflet();if(!map){map=L.map('map',{zoomControl:false,attributionControl:false,scrollWheelZoom:false,doubleClickZoom:false,dragging:false,keyboard:false,touchZoom:false,boxZoom:false,zoomAnimation:false,fadeAnimation:false}).setView(ll(latest.origin),15);L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19}).addTo(map)}clear();const activePlaces=latest.places.filter(place=>place.connector===latest.active);const focusPlaces=activePlaces.length?activePlaces:latest.places;const zoom=latest.radiusKm===1?16:latest.radiusKm===3?14:15;if(focusPlaces.length>1){map.fitBounds(L.latLngBounds(focusPlaces.map(place=>ll(place.coordinates))),{padding:[65,65],maxZoom:zoom,animate:false})}else if(focusPlaces.length===1){map.setView(ll(focusPlaces[0].coordinates),zoom,{animate:false})}else{map.setView(ll(latest.origin),zoom,{animate:false})}const home=L.circleMarker(ll(latest.origin),{className:'home-pin',radius:8,color:'#fff4d1',weight:2,fillColor:'#f0d789',fillOpacity:.96}).addTo(map);home.bindTooltip('Home area',{direction:'top'});markers.push(home);for(const place of latest.places){const active=place.connector===latest.active;const colour=colours[place.connector]||'#dfc47e';const marker=L.circleMarker(ll(place.coordinates),{className:'poi',radius:active?6:4,color:'#092322',weight:1.5,fillColor:colour,fillOpacity:active?1:.3,opacity:active?1:.5}).addTo(map);marker.bindTooltip(place.name,{direction:'top',opacity:.96});marker.on('click',()=>parent.postMessage({channel:'estate-mini-map',selected:place.id},location.origin));markers.push(marker)}setTimeout(()=>map.invalidateSize(false),0)}
addEventListener('message',event=>{if(event.origin!==location.origin||event.source!==parent||event.data?.channel!=='estate-mini-map')return;latest=event.data;render()});parent.postMessage({channel:'estate-mini-map',ready:true},location.origin);
</script></html>
