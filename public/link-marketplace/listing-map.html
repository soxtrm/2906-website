<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="/link-marketplace/vendor/leaflet.css"><style>html,body,#map{height:100%;margin:0;background:#17312c}.leaflet-tile-pane{filter:invert(1) hue-rotate(170deg) saturate(.25) brightness(.8)}</style><div id="map"></div><script src="/link-marketplace/vendor/leaflet.js"></script><script>
const map=L.map('map',{scrollWheelZoom:false}).setView([35.91,14.44],10);L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'© OpenStreetMap',maxZoom:19}).addTo(map);const group=L.featureGroup().addTo(map);addEventListener('message',e=>{if(e.origin!==location.origin||e.source!==parent||e.data?.channel!=='estate-listing-map')return;group.clearLayers();for(const p of e.data.pins||[]){const marker=L.circleMarker([p.coordinates[1],p.coordinates[0]],{radius:7,color:'#e8d08b',weight:2,fillColor:'#66bfa8',fillOpacity:.85}).addTo(group);const label=document.createElement('span');label.textContent=p.name+' · €'+Number(p.price).toLocaleString();marker.bindTooltip(label);marker.on('click',()=>parent.postMessage({channel:'estate-listing-map',selected:p.id},location.origin))}if(group.getLayers().length)map.fitBounds(group.getBounds(),{padding:[30,30],maxZoom:14})});parent.postMessage({channel:'estate-listing-map',ready:true},location.origin);
</script></html>
