<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Explore the property area</title><style>
html,body{margin:0;height:100%;overflow:hidden;background:#102623}#map{position:absolute;inset:-5%;width:110%;height:110%;background:#102623;transform:rotate(-1.4deg) scale(1.025);transform-origin:50% 50%;animation:mapCompass 18s ease-in-out infinite alternate;will-change:transform}
/* Keep the street network present and readable without turning this into a
   conventional navigation map. POIs and verified routes live in sharper panes. */
.leaflet-tile-pane{filter:invert(1) hue-rotate(166deg) saturate(.34) brightness(.9) contrast(1.12);opacity:.72}
#map:after{content:"";position:absolute;z-index:350;inset:0;pointer-events:none;background:radial-gradient(circle at 50% 48%,transparent 0 42%,rgb(7 28 27/.02) 62%,rgb(7 24 24/.2) 100%);-webkit-backdrop-filter:blur(.65px);backdrop-filter:blur(.65px);-webkit-mask-image:radial-gradient(circle at 50% 48%,transparent 0 58%,#000 96%);mask-image:radial-gradient(circle at 50% 48%,transparent 0 58%,#000 96%)}
.leaflet-overlay-pane,.leaflet-marker-pane,.leaflet-tooltip-pane,.leaflet-popup-pane{filter:none}
.leaflet-control-attribution{background:rgb(7 24 24/.76)!important;color:rgb(255 255 255/.62)!important;font:8px/1.35 ui-sans-serif,sans-serif!important}.leaflet-control-attribution a{color:#dfc77d!important}
button{width:44px;height:44px;border:0;border-radius:10px;background:#fffdf5;color:#18342e;font-size:23px;cursor:pointer}.nexus-poi-glow{filter:drop-shadow(0 0 4px #91d9bd)}.nexus-route-flow{stroke-dashoffset:0;animation:route 15s linear infinite}@keyframes route{to{stroke-dashoffset:-130}}@keyframes mapCompass{0%{transform:rotate(-1.4deg) scale(1.025)}50%{transform:rotate(.4deg) scale(1.035)}100%{transform:rotate(1.6deg) scale(1.025)}}@media(prefers-reduced-motion:reduce){#map{animation:none;transform:scale(1.025)}.nexus-route-flow{animation:none}}#error{color:white;position:absolute;top:45%;padding:20px;font:16px sans-serif}.controls{position:absolute;z-index:1000;right:6px;top:8px;display:grid;gap:0}.controls button{width:44px;height:44px;padding:0;border:0;border-radius:0;background:transparent;color:#fff;font:24px/1 Arial,sans-serif;cursor:pointer;text-shadow:0 1px 5px #000;transition:transform .18s ease}.controls button:hover{transform:scale(1.18)}.controls button:focus-visible{outline:1px solid white;outline-offset:-6px}.controls button:last-child{font-size:22px}@media(max-width:640px){#map:after{-webkit-backdrop-filter:blur(1.6px);backdrop-filter:blur(1.6px);-webkit-mask-image:radial-gradient(circle at 50% 46%,transparent 0 48%,#000 88%);mask-image:radial-gradient(circle at 50% 46%,transparent 0 48%,#000 88%)}}@media(prefers-reduced-motion:reduce){.controls button{transition:none}.controls button:hover{transform:none}}
</style><div id="map"></div><div class="controls"><button id="in" aria-label="Zoom in">+</button><button id="out" aria-label="Zoom out">−</button><button id="home" aria-label="Return to area">✦</button></div><p id="error" hidden>Map unavailable. Place details remain available below.</p><script type="module">
import {createPropertyMap} from './property-map.mjs';
let map, latest, originKey, building=false;
const notify=(value)=>parent.postMessage({channel:'estate-area-map',...value},location.origin);
async function render(){if(!latest||building)return;if(map&&originKey!==JSON.stringify(latest.intelligence.origin)){map.destroy();map=null;}if(!map){originKey=JSON.stringify(latest.intelligence.origin);building=true;try{map=await createPropertyMap(document.getElementById('map'),latest.intelligence,{onSelect:id=>notify({selected:id})});}catch{document.getElementById('error').hidden=false;}finally{building=false;}}if(!map)return;map.select(latest.category,latest.selected?[]:latest.places);if(latest.selected)map.focus(latest.selected);map.route(latest.geometry,latest.mode);}
addEventListener('message',event=>{if(event.origin!==location.origin||event.source!==parent||event.data?.channel!=='estate-area-map')return;latest=event.data;render();});
document.getElementById('in').onclick=()=>map?.zoom(1);document.getElementById('out').onclick=()=>map?.zoom(-1);document.getElementById('home').onclick=()=>map?.recenter();notify({ready:true});
</script></html>
