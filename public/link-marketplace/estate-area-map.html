<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Explore the property area</title><style>html,body,#map{margin:0;height:100%;background:#142623} .leaflet-tile-pane{filter:invert(1) hue-rotate(170deg) saturate(.25) brightness(.78)} .controls{position:absolute;z-index:1000;right:12px;top:12px;display:grid;gap:5px}button{width:44px;height:44px;border:0;border-radius:10px;background:#fffdf5;color:#18342e;font-size:23px;cursor:pointer}.nexus-poi-glow{filter:drop-shadow(0 0 4px #91d9bd)}.nexus-route-flow{stroke-dashoffset:0;animation:route 15s linear infinite}@keyframes route{to{stroke-dashoffset:-130}}@media(prefers-reduced-motion:reduce){.nexus-route-flow{animation:none}}#error{color:white;position:absolute;top:45%;padding:20px;font:16px sans-serif}</style><div id="map"></div><div class="controls"><button id="in" aria-label="Zoom in">+</button><button id="out" aria-label="Zoom out">−</button><button id="home" aria-label="Return to area">⌖</button></div><p id="error" hidden>Map unavailable. Place details remain available below.</p><script type="module">
import {createPropertyMap} from './property-map.mjs';
let map, latest, originKey, building=false;
const notify=(value)=>parent.postMessage({channel:'estate-area-map',...value},location.origin);
async function render(){if(!latest||building)return;if(map&&originKey!==JSON.stringify(latest.intelligence.origin)){map.destroy();map=null;}if(!map){originKey=JSON.stringify(latest.intelligence.origin);building=true;try{map=await createPropertyMap(document.getElementById('map'),latest.intelligence,{onSelect:id=>notify({selected:id})});}catch{document.getElementById('error').hidden=false;}finally{building=false;}}if(!map)return;map.select(latest.category,latest.places);if(latest.selected)map.focus(latest.selected);map.route(latest.geometry,latest.mode);}
addEventListener('message',event=>{if(event.origin!==location.origin||event.source!==parent||event.data?.channel!=='estate-area-map')return;latest=event.data;render();});
document.getElementById('in').onclick=()=>map?.zoom(1);document.getElementById('out').onclick=()=>map?.zoom(-1);document.getElementById('home').onclick=()=>map?.recenter();notify({ready:true});
</script></html>
