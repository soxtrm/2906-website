    function applyTheme(name){ const t=THEMES[name]; if(!t) return; const r=document.documentElement; r.style.setProperty('--map-saturation',t.mapFilter.saturation); r.style.setProperty('--map-contrast',t.mapFilter.contrast); r.style.setProperty('--map-brightness',t.mapFilter.brightness); r.style.setProperty('--grade-main-opacity',t.css.mainOpacity); r.style.setProperty('--grade-main-blend',t.css.mainBlend); r.style.setProperty('--grade-main-bg',t.css.mainBg); r.style.setProperty('--grade-warm-opacity',t.css.warmOpacity); r.style.setProperty('--grade-warm-bg',t.css.warmBg); r.style.setProperty('--grade-water-opacity',t.css.waterOpacity); r.style.setProperty('--grade-water-blend',t.css.waterBlend); r.style.setProperty('--grade-water-bg',t.css.waterBg); r.style.setProperty('--vignette-color',t.css.vignette); if(map.setFog) map.setFog({color:t.fog.color,'high-color':t.fog.high,'horizon-blend':t.fog.blend,'space-color':t.fog.space,'star-intensity':t.fog.stars}); restyleRawBaseLayers(t); setLayer(LAYERS.waterDepth,'fill-color',t.waterDepth); setLayer(LAYERS.waterLife,'fill-color',t.waterLife); setLayer(LAYERS.waterWarm,'fill-color',t.waterWarm); setLayer(LAYERS.waterWarm,'fill-opacity',t.waterWarmOpacity); setLayer(LAYERS.greenBase,'fill-color',t.greenBase); setLayer(LAYERS.greenSoft,'fill-color',t.greenSoft); setLayer(LAYERS.parkFill,'fill-color',t.parkFill); setLayer(LAYERS.parkWarm,'fill-color',t.parkWarm); setLayer(LAYERS.parkWarm,'fill-opacity',t.parkWarmOpacity); setLayer(LAYERS.parkOutline,'line-color',t.parkOutline); setLayer(LAYERS.buildingMain,'fill-extrusion-color',buildingGradient(t.building)); setLayer(LAYERS.buildingWarm,'fill-extrusion-color',buildingWarmGradient(t.buildingWarm)); setLayer(LAYERS.buildingWarm,'fill-extrusion-opacity',t.buildingWarmOpacity); setLayer(LAYERS.roadBase,'line-color',t.roadBase); setLayer(LAYERS.roadAmbient,'line-color',t.roadAmbient); setLayer(LAYERS.roadAmbient,'line-opacity',['interpolate',['linear'],['zoom'],14,t.roadAmbientOpacity[0],16,t.roadAmbientOpacity[1],18,t.roadAmbientOpacity[2],20,t.roadAmbientOpacity[3]]); setLayer(LAYERS.sunReflectionGlow,'line-opacity',Math.max(0,t.sunReflectionOpacity*.55)); setLayer(LAYERS.sunReflectionCore,'line-opacity',t.sunReflectionOpacity); setLayer(LAYERS.waterShimmerGlow,'line-color',t.shimmer); setLayer(LAYERS.waterShimmerCore,'line-color',t.shimmerCore); setLayer(LAYERS.waterShimmerCore,'line-opacity',t.shimmerOpacity); setLayer(LAYERS.promenadeGlow,'circle-opacity',t.lightsOpacity*.45); setLayer(LAYERS.promenadeCore,'circle-opacity',t.lightsOpacity); setLayer(LAYERS.windowGlow,'circle-opacity',t.lightsOpacity*.35); setLayer(LAYERS.windowCore,'circle-opacity',t.lightsOpacity*.75); updateButtons(name); }
    function restyleRawBaseLayers(t){ (map.getStyle().layers||[]).forEach(layer=>{ const id=layer.id.toLowerCase(); try{ if(id.includes('water')&&layer.type==='fill'){ map.setPaintProperty(layer.id,'fill-color',t.waterBase); map.setPaintProperty(layer.id,'fill-opacity',.96); } if((id.includes('park')||id.includes('landuse')||id.includes('landcover')||id.includes('grass')||id.includes('natural')||id.includes('wood')||id.includes('scrub')||id.includes('vegetation'))&&layer.type==='fill'){ map.setPaintProperty(layer.id,'fill-color',t.greenBaseRaw); map.setPaintProperty(layer.id,'fill-opacity',.70); } if((id.includes('road')||id.includes('street')||id.includes('bridge'))&&layer.type==='line'){ map.setPaintProperty(layer.id,'line-color',t.roadBase); map.setPaintProperty(layer.id,'line-opacity',.34); map.setPaintProperty(layer.id,'line-blur',.10); } }catch(e){} }); }
    function themeForTime(hour){ if(hour>=6.5&&hour<8.5) return 'sunrise'; if(hour>=8.5&&hour<12) return 'morning'; if(hour>=12&&hour<18.5) return 'day'; if(hour>=18.5&&hour<20.5) return 'sunset'; return 'night'; }
    function formatTime(hour){ const h=Math.floor(hour); const m=Math.round((hour-h)*60); return `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}`; }
    function wireControls(){ document.querySelectorAll('.theme-btn').forEach(btn=>btn.addEventListener('click',()=>{ applyTheme(btn.dataset.theme); const d={sunrise:7,morning:9.5,day:13,sunset:19.3,night:21}; document.getElementById('timeSlider').value=d[btn.dataset.theme]; document.getElementById('timeLabel').textContent=`${formatTime(d[btn.dataset.theme])} | ${cap(btn.dataset.theme)}`; })); const s=document.getElementById('timeSlider'); s.addEventListener('input',()=>{ const hour=parseFloat(s.value); const theme=themeForTime(hour); applyTheme(theme); document.getElementById('timeLabel').textContent=`${formatTime(hour)} | ${cap(theme)}`; }); }
    function updateButtons(name){ document.querySelectorAll('.theme-btn').forEach(btn=>btn.classList.toggle('active',btn.dataset.theme===name)); }
    function buildingGradient(c){ return ['interpolate',['linear'],['coalesce',['get','height'],10],0,c[0],20,c[1],55,c[2],100,c[3],180,c[4]]; }
    function buildingWarmGradient(c){ return ['interpolate',['linear'],['coalesce',['get','height'],10],0,c[0],45,c[1],120,c[2]]; }
    function cap(s){ return s.charAt(0).toUpperCase()+s.slice(1); }
    function setLayer(layerId,prop,val){ try{ if(map.getLayer(layerId)) map.setPaintProperty(layerId,prop,val); }catch(e){} }
    function addSourceSafe(id,source){ try{ if(map.getSource(id)){ if(source.type==='geojson'&&map.getSource(id).setData) map.getSource(id).setData(source.data); return; } map.addSource(id,source); }catch(e){ console.warn('Source skipped:',id,e.message); } }
    function addLayerSafe(layer){ try{ if(map.getLayer(layer.id)) map.removeLayer(layer.id); map.addLayer(layer); }catch(e){ console.warn('Layer skipped:',layer.id,e.message); } }
    function bringCustomLayersForward(){ Object.values(LAYERS).forEach(id=>{ try{ if(map.getLayer(id)) map.moveLayer(id); }catch(e){} }); }
  </script>
